<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css" type="text/css">
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<title>文纹Text-Texture</title>
</head>
<body>

<!-- ==================== 前置探索页 ==================== -->
<div id="cover-page">
	<div id="intro-page">
		<header id="intro-hero">
			<div id="intro-logo-wrap">
				<img id="cover-logo" src="logo.png" alt="文纹 Text-Texture">
			</div>
			<img id="intro-pattern-sheet" src="intro-design/pattern-sheet.png" alt="纹样示例">
		</header>

		<main id="intro-content">
			<img class="intro-mark-logo" src="logo.png" alt="文纹 Text-Texture">

			<section class="intro-section">
				<img class="intro-text-image" src="intro-design/about-text.png" alt="关于本项目">
			</section>

			<section class="intro-section">
				<img class="intro-text-image intro-text-image--pattern" src="intro-design/text-pattern-text.png" alt="文字生纹">
				<img class="intro-flow-sheet" src="intro-design/flow-map.png" alt="文字生纹映射示例">
				<img class="intro-text-image" src="intro-design/different-text-text.png" alt="不同文本会留下不同的视觉痕迹">
			</section>

			<section class="intro-gallery-sheet-wrap">
				<img class="intro-gallery-sheet" src="intro-design/examples.png" alt="文字与对应纹样示例">
			</section>

			<section id="intro-action">
				<p>输入一段文字，观察它如何在经纬之间生成独有的纹样。</p>
				<button id="cover-enter-btn" aria-label="开始探索"><img src="intro-design/start-button.png" alt="开始探索"></button>
			</section>
		</main>
		<img id="intro-footer-art" src="intro-design/footer.png" alt="Text-Texture">
	</div>
</div>

<!-- ==================== 主界面 ==================== -->
<div id="main-page" style="display:none;">

<!-- 背景纹样层（转换完成后填充） -->
<div id="bg-pattern"></div>

<!-- 主界面左上角 Logo 图案（覆盖在原界面上，不参与布局） -->
<div id="main-logo" aria-label="文纹 Text-Texture">
	<img src="logo.png" alt="文纹 Text-Texture">
</div>

<!-- 隐藏编辑栏按钮 -->
<button id="toggle_editor_btn">隐藏编辑栏</button>

<!-- 主体区域 -->
<div id="app-container">
	<!-- 左侧：网格画布区域 -->
	<div id="grid-wrapper">
		<div id="grid-inner">
			<canvas id="grid-canvas"></canvas>
			<!-- 转换进度遮罩 -->
			<div id="progress-overlay" style="display:none;">
				<div id="progress-box">
					<div id="progress-text">转换中……</div>
					<div id="progress-bar-bg">
						<div id="progress-bar-fill"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 右侧：编辑面板 -->
	<div id="editor-panel">
		<!-- 输入区 -->
		<div id="editor-card">
			<div id="textarea-wrapper">
				<textarea id="text_input" maxlength="200" placeholder="在此输入文本……"></textarea>
				<div id="char-count">0/200</div>
			</div>
		</div>
		<button id="convert_btn">转换为纹样</button>
	</div>
</div>

<!-- 下载按钮 -->
<button id="download_btn">下载</button>

<!-- 页脚签名 -->
<p style="position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#999;z-index:10;">tlonehu</p>

</div><!-- #main-page end -->

<script src="linguistic.js"></script>
<script src="weave-renderer.js"></script>
<script src="main.js"></script>
</body>
</html>
