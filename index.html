<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css" type="text/css">
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<title>织语 — 文字转织物纹样</title>
</head>
<body>

<!-- 背景纹样层（转换完成后填充） -->
<div id="bg-pattern"></div>

<!-- 隐藏编辑栏按钮 -->
<button id="toggle_editor_btn">隐藏编辑栏</button>

<!-- 主体区域 -->
<div id="app-container">
	<!-- 左侧：网格画布区域 -->
	<div id="grid-wrapper">
		<div id="grid-inner">
			<canvas id="grid-canvas"></canvas>
			<!-- 转换进度遮罩 -->
			<div id="progress-overlay" style="display:none;">
				<div id="progress-box">
					<div id="progress-text">转换中……</div>
					<div id="progress-bar-bg">
						<div id="progress-bar-fill"></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 右侧：编辑面板 -->
	<div id="editor-panel">
		<!-- 输入区 -->
		<div id="editor-card">
			<div id="textarea-wrapper">
				<textarea id="text_input" maxlength="200" placeholder="在此输入文本……"></textarea>
				<div id="char-count">0/200</div>
			</div>
		</div>
		<button id="convert_btn">转换为纹样</button>
	</div>
</div>

<!-- 下载按钮 -->
<button id="download_btn">下载</button>

<!-- 页脚签名 -->
<p style="position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#999;z-index:10;">tlonehu</p>

<script src="linguistic.js"></script>
<script src="weave-renderer.js"></script>
<script src="main.js"></script>
</body>
</html>
